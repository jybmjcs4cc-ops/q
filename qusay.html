   <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جارٍ التحويل…</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a2a1f; color: #f7f4ec;
      font-family: "Cairo", Tahoma, sans-serif; text-align: center;
    }
    a { color: #b8e878; }
  </style>
</head>
<body>
  <main>
    <p>هيتم تحويلك خلال <span id="count">3</span> ثوانٍ…</p>
    <a id="fallback" href="https://example.com">اضغط هنا لو التحويل ما اشتغلش</a>
  </main>

  <script>
    const target = "https://vt.tiktok.com/ZSgpDRqTS/"; 
    document.getElementById("fallback").href = target;

    let seconds = 1;
    const counter = document.getElementById("count");
    const timer = setInterval(() => {
      seconds -= 1;
      counter.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        location.replace(target);
      }
    }, 1000);
  </script>
</body>
</html> 
</body>
</html>
